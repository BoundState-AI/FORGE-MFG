# Module:   nginx.conf
# Purpose:  SPA fallback routing + security headers for FORGE-MFG
#           frontend container.
# Rev:      0.2.0
#
# BoundState Proprietary
# Co-Authored-By: Dr. Joseph Wilde, BoundState AI
# Co-Authored-By: Claude "Beth" (Opus 4.7)
#
# Why nginx: Spec §2.2 — frontend is served by nginx in ECS behind the
# ALB.  No CloudFront (GovCloud constraint).  The ALB routes /api/ to
# the API service and / to this frontend service.
#
# 6A-2 rev 0.2.0: add HSTS + CSP so staging smoke (and spec §9.3.8)
# see the full security-header contract on the frontend response.
# Values mirror spec §9.3.8 line-for-line.  The CSP connect-src
# allowance list covers GovCloud Cognito + S3 presigned endpoints
# so evidence / document uploads work without relaxing the policy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively (hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (spec §9.3.8).
    # `always` flag emits the header on ALL responses, including
    # 4xx/5xx, so the smoke CSP/HSTS checks hold even on error pages.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cognito-idp.us-gov-west-1.amazonaws.com https://s3.us-gov-west-1.amazonaws.com https://*.s3.us-gov-west-1.amazonaws.com" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
