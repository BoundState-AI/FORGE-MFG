# Module:   nginx.conf
# Purpose:  SPA fallback routing for FORGE-MFG frontend container.
# Rev:      0.1.0
#
# BoundState Proprietary
# Co-Authored-By: Dr. Joseph Wilde, BoundState AI
# Co-Authored-By: Claude "Beth" (Opus 4.6)
#
# Why nginx: Spec §2.2 — frontend is served by nginx in ECS behind the
# ALB.  No CloudFront (GovCloud constraint).  The ALB routes /api/ to
# the API service and / to this frontend service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively (hashed filenames from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (spec §9.3)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
