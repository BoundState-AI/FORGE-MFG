# Module:   Rollback Production Pipeline
# Purpose:  Services-only rollback to a previously-promoted production
#           image tag.  Per spec §9.2 + 6A-3B contract: ECS rolling
#           deploy at min-healthy-percent=100 swaps task defs back to
#           the prior known-good tag.  No automated alembic downgrade
#           — the DB recovery path is the pre-deploy snapshot taken
#           by deploy-production.yml.  See ops doc §12.
# Rev:      0.1.0
#
# BoundState Proprietary
# Co-Authored-By: Dr. Joseph Wilde, BoundState AI
# Co-Authored-By: Claude "Beth" (Opus 4.7)
#
# Why services-only with no automatic downgrade (finding 3):
#   Expand-contract migration discipline (spec §9.2 / docs/ops/6A_2 §6)
#   means the previous image continues to read/write the migrated
#   schema correctly during the rollback window.  An automated
#   `alembic downgrade -1` is not target-aware — it would silently
#   downgrade the wrong number of revisions for a multi-release
#   rollback.  When non-backward-compatible schema changes have
#   shipped (operator error vs. the discipline), the recovery path
#   is restore-from-snapshot of the pre-deploy snapshot taken in
#   step 4 of deploy-production.yml, NOT a downgrade chain.  The
#   snapshot's tags carry forge:image_tag + forge:release_label +
#   forge:source_workflow_run as the evidence trail.

name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      rollback_image_tag:
        description: >-
          The previously-promoted production image tag to roll back
          to.  Must already exist in the production ECR repos for
          api, frontend, AND worker.
        required: true
        type: string
      release_label:
        description: >-
          Operator label identifying the rollback target (e.g.
          rc2-2026-04-19).  Recorded for audit trail.  Must start
          with a letter; only ASCII letters, digits, and hyphens
          allowed; no consecutive or trailing hyphens; max 24 chars
          (kept consistent with deploy-production for audit-trail
          shape, even though we do not interpolate it into a
          snapshot identifier here).
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Same concurrency group as deploy-production so a promote and a
# rollback cannot interleave against the same production environment.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-gov-west-1
  DR_REGION: us-gov-east-1

jobs:
  # -------------------------------------------------------------------
  # 1. preflight — validate inputs, verify rollback tag exists in
  #    PRODUCTION ECR (rollback only works to a previously-promoted
  #    tag; if the tag never shipped to prod, the recovery path is
  #    snapshot restore, not this workflow).
  # -------------------------------------------------------------------
  preflight:
    name: Preflight + verify rollback tag in production ECR
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_digest: ${{ steps.digests.outputs.api_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
      worker_digest: ${{ steps.digests.outputs.worker_digest }}
    steps:
      - name: Validate inputs
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_image_tag }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          if ! [[ "$ROLLBACK_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::rollback_image_tag input contains disallowed characters or is too long"
            exit 1
          fi
          # Same release_label sanitization as deploy-production for
          # consistent audit-trail shape, even though we do not
          # interpolate it into a snapshot id here.
          if ! [[ "$RELEASE_LABEL" =~ ^[A-Za-z][A-Za-z0-9-]{0,23}$ ]]; then
            echo "::error::release_label must match ^[A-Za-z][A-Za-z0-9-]{0,23}$"
            exit 1
          fi

      - name: Configure AWS credentials via OIDC (production role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify all three production repos carry the rollback tag.
      # If any is missing, the rollback would deploy a partial set
      # (e.g. old api against new frontend) — fail before any change.
      - name: Resolve rollback digests in production ECR
        id: digests
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_image_tag }}
          PRODUCTION_ACCOUNT_ID: ${{ secrets.PRODUCTION_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for svc in api frontend worker; do
            REPO="forge-mfg-production-${svc}"
            DIGEST=$(aws ecr describe-images \
              --registry-id "$PRODUCTION_ACCOUNT_ID" \
              --region "$AWS_REGION" \
              --repository-name "$REPO" \
              --image-ids "imageTag=$ROLLBACK_TAG" \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null || echo "")
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
              echo "::error::production ECR repo $REPO has no image at tag $ROLLBACK_TAG — cannot roll back to a tag that was never promoted; if the schema is broken, restore from the pre-deploy snapshot per docs/ops/6A_3B_production_promotion.md §12"
              exit 1
            fi
            echo "${svc}_digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "rollback target $svc digest: $DIGEST"
          done

      - name: Verify production services stack exists
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name forge-mfg-production-services \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "")
          if [ -z "$STATUS" ]; then
            echo "::error::forge-mfg-production-services stack does not exist; nothing to roll back"
            exit 1
          fi
          echo "services stack status: $STATUS"

  # -------------------------------------------------------------------
  # 2. rollback-services — cdk deploy services with the rollback tag.
  #    ECS rolling deploy at min-healthy-percent=100 (already wired
  #    in services.py) swaps task defs back to the prior tag.
  # -------------------------------------------------------------------
  rollback-services:
    name: Roll back services to prior tag
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[infra]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - name: Configure AWS credentials via OIDC (production role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy services with rollback tag
        run: |
          cdk deploy forge-mfg-production-services \
            --require-approval never \
            --context forge:env=production \
            --context forge:account=${{ secrets.PRODUCTION_ACCOUNT_ID }} \
            --context forge:region=${{ env.AWS_REGION }} \
            --context forge:dr_region=${{ env.DR_REGION }} \
            --context forge:alb_domain=${{ secrets.PRODUCTION_ALB_DOMAIN }} \
            --context forge:cert_arn=${{ secrets.PRODUCTION_CERT_ARN }} \
            --context forge:alert_email=${{ secrets.PRODUCTION_ALERT_EMAIL }} \
            --context forge:image_tag=${{ inputs.rollback_image_tag }}

  # -------------------------------------------------------------------
  # 3. smoke — re-verify the rolled-back release with the same probe
  #    set the promote workflow uses.  Failure here means the
  #    rollback also did not produce a healthy environment; operator
  #    must escalate per ops doc §12 (snapshot restore is next).
  # -------------------------------------------------------------------
  smoke:
    name: Production smoke (post-rollback)
    needs: rollback-services
    runs-on: ubuntu-latest
    environment: production
    env:
      FORGE_SMOKE_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      FORGE_SMOKE_ALLOWED_ORIGIN: https://${{ secrets.PRODUCTION_ALB_DOMAIN }}
      FORGE_SMOKE_COGNITO_USER_POOL_ID: ${{ secrets.PRODUCTION_COGNITO_USER_POOL_ID }}
      FORGE_SMOKE_COGNITO_APP_CLIENT_ID: ${{ secrets.PRODUCTION_COGNITO_APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - name: Configure AWS credentials via OIDC (production role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mint production smoke token
        env:
          PRODUCTION_TEST_USERNAME: ${{ secrets.PRODUCTION_TEST_USERNAME }}
          PRODUCTION_TEST_PASSWORD: ${{ secrets.PRODUCTION_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN=$(aws cognito-idp admin-initiate-auth \
            --user-pool-id "$FORGE_SMOKE_COGNITO_USER_POOL_ID" \
            --client-id "$FORGE_SMOKE_COGNITO_APP_CLIENT_ID" \
            --auth-flow ADMIN_USER_PASSWORD_AUTH \
            --auth-parameters "USERNAME=$PRODUCTION_TEST_USERNAME,PASSWORD=$PRODUCTION_TEST_PASSWORD" \
            --query "AuthenticationResult.AccessToken" \
            --output text)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::Failed to mint production smoke token during rollback verification"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "FORGE_SMOKE_TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run production smoke probes (post-rollback)
        run: python -m scripts.smoke.deploy_smoke
