# Module:   Deploy Staging Pipeline
# Purpose:  Single staging-only deploy workflow per spec §9.2.  Runs
#           on manual dispatch or a push to the `staging` branch.
#           NO production deploy is part of this workflow — production
#           lives in a separate 6A-3 workflow.
# Rev:      0.3.0
#
# BoundState Proprietary
# Co-Authored-By: Dr. Joseph Wilde, BoundState AI
# Co-Authored-By: Claude "Beth" (Opus 4.7)
#
# 6A-2 rev 0.3 — round-three review finding:
#   The prior workflow deployed the primary stack (with ECS
#   services pinned to the new image SHA) BEFORE migrate ran.
#   `/health` is a liveness probe that doesn't touch the DB, so
#   ECS would mark new tasks healthy against an unmigrated schema.
#   The `force-new-deployment` after migrate was a second rollout,
#   not a gate.
#
#   Fix (rev 0.3): ECS services moved to a new `services` stack.
#   Workflow now deploys `primary` (infra only — no ECS), runs
#   migrations against the just-provisioned RDS, then deploys
#   `services` which lands the ECS rollout with the new SHA
#   against a migrated schema.
#
# Workflow sequence:
#   0. test               — unit + infra contract, lint, typecheck.
#   1. build              — build api / frontend / worker images.
#   2. scan               — Trivy CRITICAL/HIGH gate per image.
#   3. deploy-bootstrap   — idempotent ECR provisioning.
#   4. push               — ECR push of the SHA-tagged images.
#   5. deploy-primary     — dr-foundation + primary (infra only;
#                            NO ECS services).
#   6. migrate            — Alembic `upgrade head` against staging.
#                            Runs AFTER primary provisions the RDS
#                            + DB secret, BEFORE any ECS services
#                            exist to shift traffic.
#   7. deploy-services    — ECS cluster + three Fargate services +
#                            per-service alarms.  Task defs pinned
#                            to the SHA from step 4; rolling deploy
#                            passes health checks against an
#                            already-migrated schema.
#   8. deploy-dr-replica  — cross-region read replica.
#   9. smoke              — token mint + probes.

name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  id-token: write          # OIDC assume-role on AWS
  security-events: write   # Trivy SARIF upload
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-gov-west-1
  DR_REGION: us-gov-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Test + lint + typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev,infra]"
      - run: ruff check forge/ infra/ tests/ scripts/
      - run: mypy forge/ infra/
      - name: Bootstrap test schema
        run: alembic upgrade head
        env:
          FORGE_DATABASE_URL: postgresql+asyncpg://forge:forge@localhost:5432/forge_test
      - run: pytest tests/unit/ -q
        env:
          FORGE_ENV: test
          FORGE_AUTH_MODE: local
          FORGE_DATABASE_URL: postgresql+asyncpg://forge:forge@localhost:5432/forge_test

  build:
    name: Build ${{ matrix.service }} image
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile
            context: .
          - service: worker
            dockerfile: Dockerfile
            context: .
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: forge-mfg-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          push: false
          load: true
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  scan:
    name: Trivy ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, worker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/${{ matrix.service }}.tar
      - name: Trivy scan (CRITICAL/HIGH gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: forge-mfg-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  deploy-bootstrap:
    name: Deploy bootstrap stack (ECR)
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[infra]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Idempotent — CloudFormation no-op after first successful
      # deploy.  Resolves the fresh-staging bootstrap chicken-and-egg
      # (6A-2 review finding 2) because `docker push` later in this
      # workflow needs the ECR repos to exist.
      - name: cdk deploy bootstrap
        run: |
          cdk deploy forge-mfg-staging-bootstrap \
            --require-approval never \
            --context forge:env=staging \
            --context forge:account=${{ secrets.STAGING_ACCOUNT_ID }} \
            --context forge:region=${{ env.AWS_REGION }} \
            --context forge:dr_region=${{ env.DR_REGION }} \
            --context forge:image_tag=${{ env.IMAGE_TAG }}

  push:
    name: Push ${{ matrix.service }} to ECR
    needs: deploy-bootstrap
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/${{ matrix.service }}.tar
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ECR login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag + push
        run: |
          set -euo pipefail
          SRC=forge-mfg-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          REPO=${{ secrets.STAGING_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/forge-mfg-staging-${{ matrix.service }}
          docker tag "$SRC" "$REPO:${{ env.IMAGE_TAG }}"
          docker tag "$SRC" "$REPO:staging-latest"
          docker push "$REPO:${{ env.IMAGE_TAG }}"
          docker push "$REPO:staging-latest"

  deploy-primary:
    name: Deploy primary + dr-foundation (infra only — no ECS)
    needs: push
    runs-on: ubuntu-latest
    outputs:
      primary_rds_arn: ${{ steps.primary_rds.outputs.arn }}
      db_secret_arn: ${{ steps.primary_rds.outputs.secret_arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[infra]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk deploy dr-foundation
        run: |
          cdk deploy forge-mfg-staging-dr-foundation \
            --require-approval never \
            --context forge:env=staging \
            --context forge:account=${{ secrets.STAGING_ACCOUNT_ID }} \
            --context forge:region=${{ env.AWS_REGION }} \
            --context forge:dr_region=${{ env.DR_REGION }} \
            --context forge:alb_domain=${{ secrets.STAGING_ALB_DOMAIN }} \
            --context forge:cert_arn=${{ secrets.STAGING_CERT_ARN }} \
            --context forge:alert_email=${{ secrets.STAGING_ALERT_EMAIL }} \
            --context forge:image_tag=${{ env.IMAGE_TAG }}

      - name: cdk deploy primary (infra only — no ECS services)
        run: |
          cdk deploy forge-mfg-staging-primary \
            --require-approval never \
            --context forge:env=staging \
            --context forge:account=${{ secrets.STAGING_ACCOUNT_ID }} \
            --context forge:region=${{ env.AWS_REGION }} \
            --context forge:dr_region=${{ env.DR_REGION }} \
            --context forge:alb_domain=${{ secrets.STAGING_ALB_DOMAIN }} \
            --context forge:cert_arn=${{ secrets.STAGING_CERT_ARN }} \
            --context forge:alert_email=${{ secrets.STAGING_ALERT_EMAIL }} \
            --context forge:image_tag=${{ env.IMAGE_TAG }}

      - name: Resolve primary stack outputs
        id: primary_rds
        run: |
          set -euo pipefail
          ARN=$(aws cloudformation describe-stacks \
            --stack-name forge-mfg-staging-primary \
            --query "Stacks[0].Outputs[?OutputKey=='PrimaryRdsArn'].OutputValue | [0]" \
            --output text)
          SECRET=$(aws cloudformation describe-stacks \
            --stack-name forge-mfg-staging-primary \
            --query "Stacks[0].Outputs[?OutputKey=='DbMasterSecretArn'].OutputValue | [0]" \
            --output text)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "::error::PrimaryRdsArn output missing from primary stack"
            exit 1
          fi
          if [ -z "$SECRET" ] || [ "$SECRET" = "None" ]; then
            echo "::error::DbMasterSecretArn output missing from primary stack"
            exit 1
          fi
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "secret_arn=$SECRET" >> "$GITHUB_OUTPUT"

  migrate:
    name: Alembic migrate staging DB
    needs: deploy-primary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Fetch staging DB credentials
        id: dbsecret
        env:
          DB_SECRET_ARN: ${{ needs.deploy-primary.outputs.db_secret_arn }}
        run: |
          set -euo pipefail
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$DB_SECRET_ARN" \
            --query SecretString --output text)
          USER=$(echo "$SECRET_JSON" | python -c "import json,sys; print(json.load(sys.stdin)['username'])")
          PASS=$(echo "$SECRET_JSON" | python -c "import json,sys; print(json.load(sys.stdin)['password'])")
          HOST=$(echo "$SECRET_JSON" | python -c "import json,sys; print(json.load(sys.stdin).get('host', ''))")
          echo "::add-mask::$PASS"
          {
            echo "FORGE_DATABASE_URL=postgresql+psycopg2://$USER:$PASS@$HOST:5432/forge?sslmode=verify-full"
          } >> "$GITHUB_ENV"
      - name: Run migrations (expand; fails pipeline on error)
        # Runs AFTER primary (RDS + DB secret provisioned) and
        # BEFORE services (ECS rollout).  This is the schema-
        # readiness gate that finding-round-three of the 6A-2
        # review required.
        run: alembic upgrade head

  deploy-services:
    name: Deploy services (ECS rollout, schema-current)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[infra]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy services (ECS with migrated schema)
        # The services stack is the only place ECS task defs live.
        # This is the rolling deploy that shifts traffic to the new
        # image SHA; it runs AFTER migrate so new code executes
        # against a schema-current DB.
        run: |
          cdk deploy forge-mfg-staging-services \
            --require-approval never \
            --context forge:env=staging \
            --context forge:account=${{ secrets.STAGING_ACCOUNT_ID }} \
            --context forge:region=${{ env.AWS_REGION }} \
            --context forge:dr_region=${{ env.DR_REGION }} \
            --context forge:alb_domain=${{ secrets.STAGING_ALB_DOMAIN }} \
            --context forge:cert_arn=${{ secrets.STAGING_CERT_ARN }} \
            --context forge:alert_email=${{ secrets.STAGING_ALERT_EMAIL }} \
            --context forge:image_tag=${{ env.IMAGE_TAG }}

  deploy-dr-replica:
    name: Deploy dr-replica (warm standby)
    needs: [deploy-primary, deploy-services]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[infra]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: cdk deploy dr-replica
        env:
          PRIMARY_RDS_ARN: ${{ needs.deploy-primary.outputs.primary_rds_arn }}
        run: |
          cdk deploy forge-mfg-staging-dr-replica \
            --require-approval never \
            --context forge:env=staging \
            --context forge:account=${{ secrets.STAGING_ACCOUNT_ID }} \
            --context forge:region=${{ env.AWS_REGION }} \
            --context forge:dr_region=${{ env.DR_REGION }} \
            --context forge:alb_domain=${{ secrets.STAGING_ALB_DOMAIN }} \
            --context forge:cert_arn=${{ secrets.STAGING_CERT_ARN }} \
            --context forge:alert_email=${{ secrets.STAGING_ALERT_EMAIL }} \
            --context forge:image_tag=${{ env.IMAGE_TAG }} \
            --context forge:primary_rds_arn="$PRIMARY_RDS_ARN"

  smoke:
    name: Staging smoke
    needs: deploy-dr-replica
    runs-on: ubuntu-latest
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_ALLOWED_ORIGIN: https://${{ secrets.STAGING_ALB_DOMAIN }}
      STAGING_COGNITO_USER_POOL_ID: ${{ secrets.STAGING_COGNITO_USER_POOL_ID }}
      STAGING_COGNITO_APP_CLIENT_ID: ${{ secrets.STAGING_COGNITO_APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Mint the smoke test token in-workflow via AdminInitiateAuth.
      # The Cognito app client has `admin_user_password=True` so
      # IAM principals with `cognito-idp:AdminInitiateAuth` (here,
      # the OIDC deploy role) can obtain an access token for the
      # staging test user without exposing the end-user
      # USER_PASSWORD_AUTH flow.  Token is written straight to
      # GITHUB_ENV with `::add-mask::` so it never appears in logs.
      - name: Mint staging smoke token
        env:
          STAGING_TEST_USERNAME: ${{ secrets.STAGING_TEST_USERNAME }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN=$(aws cognito-idp admin-initiate-auth \
            --user-pool-id "$STAGING_COGNITO_USER_POOL_ID" \
            --client-id "$STAGING_COGNITO_APP_CLIENT_ID" \
            --auth-flow ADMIN_USER_PASSWORD_AUTH \
            --auth-parameters "USERNAME=$STAGING_TEST_USERNAME,PASSWORD=$STAGING_TEST_PASSWORD" \
            --query "AuthenticationResult.AccessToken" \
            --output text)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::Failed to mint staging smoke token — check STAGING_TEST_USERNAME / STAGING_TEST_PASSWORD"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "STAGING_TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run smoke probes
        run: python -m scripts.smoke.deploy_smoke
