[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-mfg"
version = "0.1.0"
description = "FORGE-MFG: Centralized Manufacturing Execution Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "gunicorn>=21,<23",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "python-jose[cryptography]>=3.3,<4",
    "cachetools>=5.3,<6",
    "httpx>=0.27,<1",
    "boto3>=1.34,<2",
    "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<1",
    "ruff>=0.3,<1",
    "mypy>=1.9,<2",
    "pre-commit>=3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends() in function defaults — this is the standard pattern.
"forge/api/**" = ["B008"]
"tests/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# SQLAlchemy relationship() uses string forward refs resolved at runtime
# by the mapper.  mypy cannot resolve these across modules — this is a
# known limitation documented in sqlalchemy2-stubs.
[[tool.mypy.overrides]]
module = "forge.models.*"
disable_error_code = ["name-defined"]
disallow_untyped_defs = false
warn_return_any = false
